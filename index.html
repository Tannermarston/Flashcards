<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legislative Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bill print's masthead over a working ledger. Each bill gets its own page: its path through the House as a stepper, then the whip sheet for cosponsors. */
:root{
  --paper:#f2f3f6; --sheet:#ffffff; --ink:#151a26; --muted:#5b6475; --rule:#d5d9e2;
  --accent:#2a3d8f; --accent-soft:#e3e7f6; --on-accent:#ffffff;
  --crit:#a8281e; --crit-soft:#f8e2df; --warn:#8a5a00; --warn-soft:#f6ebcf; --good:#1d6b45; --good-soft:#dcefe4;
  --display:"Besley", "Century Schoolbook", Georgia, serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141c; --sheet:#1a1e29; --ink:#e8eaf1; --muted:#9aa3b5; --rule:#2f3545;
    --accent:#9fb0ff; --accent-soft:#252c4a; --on-accent:#11141c;
    --crit:#ff8f84; --crit-soft:#43201d; --warn:#f0c264; --warn-soft:#3b3015; --good:#7fd3a4; --good-soft:#173324;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141c; --sheet:#1a1e29; --ink:#e8eaf1; --muted:#9aa3b5; --rule:#2f3545;
  --accent:#9fb0ff; --accent-soft:#252c4a; --on-accent:#11141c;
  --crit:#ff8f84; --crit-soft:#43201d; --warn:#f0c264; --warn-soft:#3b3015; --good:#7fd3a4; --good-soft:#173324;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 64px}

.mast{padding:22px 0 0;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.mast .cong{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast h1{font:700 30px/1.1 var(--display);margin:8px 0 4px;text-wrap:balance}
.mast .office{color:var(--muted);font-size:14px}
.mast .office button,.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mast-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--warn)}
nav{display:flex;gap:4px;margin-top:18px;border-bottom:3px double var(--ink);overflow-x:auto}
nav a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav a b{font:500 11px var(--mono);margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--crit-soft);color:var(--crit)}

.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:13px}
body.ro [data-w]{display:none !important}

.banner{margin-top:16px;padding:10px 14px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:6px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:14px}
.note{margin-top:16px;padding:10px 14px;background:var(--warn-soft);color:var(--warn);border-radius:6px;font-size:14px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px}
.bar .sp{flex:1}
.bar input[type=search],.bar select,.inl input,.inl select{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:7px 10px;min-width:0}
.bar input[type=search]{width:220px;max-width:100%}
.bar label.ck{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}

h2{font:700 19px/1.2 var(--display);margin:0 0 10px}
h3{font:700 15px/1.2 var(--display);margin:0 0 8px}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--rule);border-radius:6px;font-size:14px}
.muted{color:var(--muted)} .sm-t{font-size:13px}
.no{font:500 12px var(--mono);color:var(--muted)}
section{margin-bottom:28px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px}

.chip{display:inline-block;font:500 11px/1.5 var(--mono);padding:1px 7px;border-radius:10px;background:var(--paper);border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.ex{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
button.chip{cursor:pointer} button.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Bill list */
.bill{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) minmax(0,3fr) minmax(0,4fr);gap:8px 20px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit}
.bill:hover{border-color:var(--ink)}
.bill.hi{box-shadow:inset 4px 0 0 var(--accent)}
.bill .ti{font:700 16px/1.25 var(--display);overflow-wrap:anywhere}
.bill .lab{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media (max-width:900px){.bill{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:520px){.bill{grid-template-columns:minmax(0,1fr)}}
.mini{display:flex;gap:3px;margin-bottom:5px}
.mini i{flex:1;height:7px;border-radius:2px;background:var(--rule)}
.mini i.d{background:var(--accent);opacity:.45} .mini i.c{background:var(--accent)}
.meter{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--good)}

/* Bill page */
.crumb{margin:18px 0 6px;font-size:14px}
.bh{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.bh h2{font-size:26px;margin:4px 0 6px;text-wrap:balance}
.bh .acts{display:flex;gap:8px;flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:18px 8px 14px;display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
.steps li{position:relative;text-align:center;padding:0 4px;font-size:13px}
.steps li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--rule)}
.steps li:first-child::before{display:none}
.steps li.d::before,.steps li.c::before{background:var(--accent)}
.steps .dot{position:relative;z-index:1;display:block;width:19px;height:19px;border-radius:50%;margin:0 auto 7px;background:var(--sheet);border:3px solid var(--rule)}
.steps li.d .dot{background:var(--accent);border-color:var(--accent)}
.steps li.c .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps li.c strong{color:var(--accent)}
.steps strong{display:block;font-weight:600;line-height:1.25}
.steps span.dt{font:12px var(--mono);color:var(--muted)}
.stepbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 24px;font-size:14px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.facts dt{font:500 11px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.nextbox{border-left:4px solid var(--ink);padding:8px 12px;background:var(--paper);border-radius:0 6px 6px 0;margin-bottom:14px}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px;align-items:baseline}
.log .dt{font:12px var(--mono);color:var(--muted)}
.inl{display:flex;gap:6px;flex-wrap:wrap}
.inl input[type=text]{flex:1;min-width:140px}
.f .inl{margin-top:8px}
.f .inl input:not([type=checkbox]),.f .inl select{width:auto}
.f .inl input[type=text]{flex:1 1 140px}

/* Funnel */
.funnel{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--rule);margin:8px 0}
.funnel i{display:block;height:100%;min-width:2px}
.s-CoLead{background:var(--good)} .s-Cosponsor{background:var(--good);opacity:.6} .s-Leaning{background:var(--accent)} .s-Asked{background:var(--warn)} .s-Target{background:var(--muted);opacity:.45} .s-Declined{background:var(--crit);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.big{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.kpis{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;margin-bottom:6px}
.kpis .k>span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td select{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:4px 6px}
.tw{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
.ths{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.ths:hover{color:var(--ink)} .ths span{font-size:12px} th[aria-sort]{color:var(--ink)}
tr.due td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
td .acts{display:flex;gap:6px;justify-content:flex-end}

/* Agenda */
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0;background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
.stat{padding:14px 16px;border-left:1px solid var(--rule)}
.stat:first-child{border-left:0}
.stat .n{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--rule)}}
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0 14px;border-top:1px solid var(--rule);padding:10px 0}
.day .d{font:500 12px/1.4 var(--mono);color:var(--muted);text-transform:uppercase;padding-top:3px}
.day .d strong{display:block;color:var(--ink);font:700 17px/1.1 var(--display);text-transform:none}
.day.today .d strong{color:var(--accent)}
.rows{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:10px;align-items:baseline;background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:4px;padding:7px 10px;width:100%;text-align:left;cursor:pointer;min-width:0}
.row:hover{border-color:var(--ink)}
.row.k-event{border-left-color:var(--accent)} .row.k-action{border-left-color:var(--ink)} .row.k-follow{border-left-color:var(--good)}
.row.late{border-left-color:var(--crit)}
.row .tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:0 0 76px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t small{display:block;color:var(--muted);font-size:13px}
.row .who{font-size:13px;color:var(--muted);text-align:right;max-width:34%;overflow-wrap:anywhere}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--rule)}
.task:last-child{border-bottom:0}
.task input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.task .t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.task .t small{display:block;color:var(--muted);font-size:13px}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:var(--muted);max-width:40%;text-align:right}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:8px}

dialog{border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:0;width:min(700px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.dh{padding:16px 20px 12px;border-bottom:3px double var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dh h2{margin:0}
.db{padding:16px 20px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.df{padding:12px 20px 16px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--sheet)}
.df .sp{flex:1}
.f{grid-column:span 6;display:flex;flex-direction:column;gap:4px;min-width:0}
.f.h{grid-column:span 3} .f.t{grid-column:span 2}
@media (max-width:520px){.f.h,.f.t{grid-column:span 6}}
.f label,.f .lab{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.f input:not([type=checkbox]),.f select,.f textarea{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.f textarea{min-height:68px;resize:vertical}
.f.ck{flex-direction:row;align-items:center;gap:8px}
.f.ck label{text-transform:none;letter-spacing:0;font:14px var(--body);color:var(--ink)}
.sd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sd label{display:block;margin-bottom:3px}
pre.draft{grid-column:span 6;white-space:pre-wrap;font:13px/1.55 var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px;margin:0;max-height:50vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:14px;max-width:calc(100vw - 32px);display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="cong">U.S. House of Representatives · Legislative staff</div>
      <h1>Legislative Planner</h1>
      <div class="office" id="office"></div>
    </div>
    <div class="mast-r">
      <span class="sync" id="sync"><i></i><span>Connecting</span></span>
      <span id="gs-ctl" class="mast-r"></span>
      <button class="btn" id="copy-rundown" data-act="copy-rundown">Copy weekly rundown</button>
    </div>
  </header>
  <nav id="nav" aria-label="Views">
    <a href="#bills" data-r="bills">Bills</a><a href="#cosponsors" data-r="cosponsors">Cosponsors</a><a href="#week" data-r="week">This week</a><a href="#calendar" data-r="calendar">Calendar</a><a href="#tasks" data-r="tasks">Tasks</a>
  </nav>
  <div id="notes"></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
const STAGES=[["concept","Concept"],["drafting","Drafting"],["support","Building support"],["introduced","Introduced"],["committee","In committee"],["floor","Floor"],["senate","Senate & beyond"],["closed","Closed"]];
const PATH=STAGES.slice(0,7);
const STAGE_NAME=Object.fromEntries(STAGES);
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s[0],i]));
const KINDS=["Bill","Resolution","Amendment","Letter","Appropriations request","Oversight"];
const PRIOS=["High","Medium","Low"];
const EVK=["Hearing","Markup","Floor","Deadline","Meeting","District","Other"];
const OST=["Target","Asked","Leaning yes","Cosponsor","Co-Lead","Declined"];
const WORK=["Leaning yes","Asked","Target","Co-Lead","Cosponsor","Declined"];
const YES=s=>s==="Cosponsor"||s==="Co-Lead";
const fixStatus=r=>{if(r&&!OST.includes(r.status))r.status=normStatus(r.status)||"Target";return r};
const DATA=["items","cosponsors","contacts","updates","events","tasks","office"];
const METHODS=["Email","Call","Meeting","In person","Text","Other"];
const COLS=DATA.concat("config");
const LS="leg-planner-v2";

const blank=()=>({items:{},cosponsors:{},contacts:{},updates:{},events:{},tasks:{},office:{},config:{}});
const DBS=blank();let SHS=blank();let S=DBS;
let mode="loading", db=null, slow=false, stale=false, loaded={};
const F={sort:null,q:"",issue:"",lead:"",closed:false,who:"",done:false,cf:"",logText:"",logDate:""};

try{const v=JSON.parse(localStorage.getItem(LS+"-sort")||"null");if(v&&typeof v.k==="string"&&(v.dir===1||v.dir===-1))F.sort={k:v.k,dir:v.dir}}catch(e){}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>iso(new Date());
const diff=s=>Math.round((parse(s)-parse(today()))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o)=>parse(s).toLocaleDateString("en-US",o||{weekday:"short",month:"short",day:"numeric"});
const short=s=>okDate(s)?fmt(s,{month:"short",day:"numeric"}):"";
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const opts=(list,cur,blank)=>(blank!=null?`<option value="">${esc(blank)}</option>`:"")+list.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`}).join("");
const vals=o=>Object.entries(o).map(([id,d])=>Object.assign({id},d));
const RO=()=>document.body.classList.contains("ro");
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4200)}
function dueChip(s){if(!okDate(s))return"";const n=diff(s);
  if(n<0)return `<span class="chip crit">${-n}d overdue</span>`;
  if(n===0)return `<span class="chip warn">Today</span>`;
  if(n<=7)return `<span class="chip warn">in ${n}d</span>`;
  return `<span class="chip">${esc(short(s))}</span>`}
const exChip=d=>d.example?` <span class="chip ex">Example</span>`:"";
const cosOf=id=>vals(S.cosponsors).filter(c=>c.itemId===id);
const nCommitted=id=>cosOf(id).filter(c=>YES(c.status)).length;
const pst=c=>[c.party,c.state].filter(Boolean).join("-");
const followDue=c=>!YES(c.status)&&c.status!=="Declined"&&okDate(c.followUp)&&c.followUp<=today();
const gone=c=>c.status==="Asked"&&!okDate(c.followUp)&&okDate(c.lastContact)&&diff(c.lastContact)<=-7;

function write(col,id,data){

/* ---------- pasted target lists ---------- */
const EM1=/[^\s<>,;"()]+@[^\s<>,;"()]+\.[A-Za-z]{2,}/;
function parseGrid(t){const rows=[];let row=[],cell="",q=false,start=true;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"'&&start){q=true;start=false}
    else if(c==="\t"){row.push(cell);cell="";start=true}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";start=true}
    else{cell+=c;start=false}}
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim().replace(/\s*[\r\n]+\s*/g,", "))).filter(r=>r.some(Boolean))}
const normParty=c=>{const m=String(c).trim().match(/^(d|r|i)(em(ocrat)?|ep(ublican)?|nd(ependent)?)?$/i);return m?m[1].toUpperCase():""};
function normStatus(c){const t=String(c).toLowerCase();
  if(/declin|^no\b|pass/.test(t))return "Declined";if(/lean/.test(t))return "Leaning yes";
  if(/co-?\s?lead/.test(t))return "Co-Lead";
  if(/commit|^yes\b|cosponsor|signed/.test(t))return "Cosponsor";if(/ask|sent|pending|review|contacted/.test(t))return "Asked";
  if(/target/.test(t))return "Target";return ""}
function parseTargets(text){
  if(text.indexOf("\t")<0)return text.split("\n").map(s=>s.trim()).filter(Boolean).map(line=>{
    const m=line.match(/[\s,(]+([DRI])\s*-\s*([A-Za-z]{2}(?:-?\s*\d{1,2}|-AL)?)\)?\s*$/);
    return {office:(m?line.slice(0,m.index):line).replace(/[,(]+$/,"").trim(),party:m?m[1]:"",state:m?m[2].toUpperCase().replace(/\s/g,""):""}});
  let rows=parseGrid(text),hdr=null;
  if(rows.length&&/^(member|name|office|rep|representative|cosponsor|target)s?\b/i.test(rows[0][0])&&!rows[0].some(c=>EM1.test(c))){hdr=rows[0];rows=rows.slice(1)}
  return rows.map(row=>{const rec={office:row[0],party:"",state:"",status:"",lastContact:"",followUp:""},names=[],emails=[],notes=[];
    for(let j=1;j<row.length;j++){const c=row[j];if(!c)continue;const h=hdr?String(hdr[j]||"").toLowerCase():"";
      const mail=()=>c.split(/[,\s]+/).filter(x=>EM1.test(x)).forEach(x=>emails.push(x));
      if(hdr){
        if(/party/.test(h))rec.party=normParty(c)||rec.party;
        else if(/district|state/.test(h))rec.state=c;
        else if(/status|position|response|answer/.test(h)){const s=normStatus(c);if(s)rec.status=s;else notes.push(hdr[j]+": "+c)}
        else if(/e-?mail/.test(h))mail();
        else if(/follow/.test(h)){const d=toIso(c);if(d)rec.followUp=d;else notes.push(hdr[j]+": "+c)}
        else if(/date|contacted|outreach|sent|asked|last contact/.test(h)){const d=toIso(c);if(d)rec.lastContact=d;else notes.push(hdr[j]+": "+c)}
        else if(/factor|relevan|why|rationale/.test(h))rec.factors=c;
        else if(/our staff|owner|assigned/.test(h))rec.owner=c;
        else if(/on committee/.test(h))rec.onCommittee=truthy(c);
        else if(/^original/.test(h))rec.original=truthy(c);
        else if(/^filed/.test(h))rec.filed=truthy(c);
        else if(/^(id|bill|bill id|example)$/.test(h))continue;
        else if(/staff|contact|point|\bla\b|\bld\b/.test(h)){if(EM1.test(c))mail();else names.push(c)}
        else if(/note|comment/.test(h))notes.push(c);
        else if(!/^(false|no|n)$/i.test(c))notes.push((hdr[j]||"Column "+(j+1))+": "+c)}
      else if(j<=3&&!rec.party&&normParty(c))rec.party=normParty(c);
      else if(EM1.test(c))mail();
      else if(/^(true|false)$/i.test(c))continue;
      else if(!rec.lastContact&&toIso(c))rec.lastContact=toIso(c);
      else if(!names.length&&row[j+1]&&EM1.test(row[j+1]))names.push(c);
      else notes.push(c)}
    rec.contact=names.join(", ");rec.email=emails.join(", ");rec.notes=notes.join("; ");
    if(!rec.status)rec.status=rec.lastContact?"Asked":"Target";return rec}).filter(r=>r.office)}

  openDlg("Paste a target list",
    `<div class="f"><span class="lab">Bill</span><div>${esc(itemTitle(itemId))}</div></div>`+
    fld("","p-text","Paste rows copied from a spreadsheet, or type one Member per line",`<textarea id="p-text" style="min-height:200px"></textarea>`)+
    `<div class="f muted sm-t">From a spreadsheet: the first column is read as the Member. Include the header row if you can, and columns headed Party, District, Status, Staff or Contact, Email, Date and Notes go to the matching fields. Without a header row, the planner picks out the party, email addresses, the staff name beside an email and the first date, and puts everything else in Notes. Typed lines can end with a party and district, e.g. Rep. Jane Doe, D-OH-04.</div>`+
    fld("h","p-owner","Assign to (optional)",inp("p-owner","",'list="staff-dl"')),
    {col:"cosponsors",id:"",saveLabel:"Add to the whip sheet",custom(){
      const have=new Set(cosOf(itemId).map(x=>key(x.office))),owner=gv("p-owner");let n=0,skip=0;
      const recs=parseTargets($("p-text").value);
      if(!recs.length)return "Paste at least one name.";
      if(recs.length>150)return "Paste 150 rows or fewer at a time.";
      recs.forEach(r=>{if(have.has(key(r.office))){skip++;return}have.add(key(r.office));n++;
        write("cosponsors",newId("c"),{itemId,office:r.office,party:r.party||"",state:r.state||"",status:r.status||"Target",contact:r.contact||"",owner:owner||r.owner||"",lastContact:r.lastContact||"",followUp:r.followUp||"",onCommittee:!!r.onCommittee,original:!!r.original,filed:!!r.filed,factors:r.factors||"",email:r.email||"",notes:r.notes||""})});
      toast(`Added ${n} office${n===1?"":"s"}${skip?", skipped "+skip+" already listed":""}.`)}});
}
function eventDlg(id,itemId){const e=id?S.events[id]:{kind:"Hearing",date:today(),itemId};if(!e)return;
  openDlg(id?"Calendar entry":"Add calendar entry",
    fld("","e-title","What",inp("e-title",e.title,'required placeholder="e.g. Subcommittee hearing"'))+
    fld("t","e-date","Date",inp("e-date",e.date,'type="date" required'))+
    fld("t","e-time","Time",inp("e-time",e.time,'type="time"'))+
    fld("t","e-kind","Type",`<select id="e-kind">${opts(EVK,e.kind)}</select>`)+
    fld("h","e-loc","Location",inp("e-loc",e.location))+
    fld("h","e-item","Bill",`<select id="e-item">${itemOpts(e.itemId)}</select>`)+
    fld("","e-notes","Prep notes",`<textarea id="e-notes">${esc(e.notes)}</textarea>`),
    {col:"events",id,save(){const title=gv("e-title"),date=gv("e-date");if(!title||!okDate(date))return "A calendar entry needs a description and a date.";
      return {title,date,time:gv("e-time"),kind:gv("e-kind"),location:gv("e-loc"),itemId:gv("e-item"),notes:gv("e-notes")}}});
}
function taskDlg(id,itemId){const t=id?S.tasks[id]:{itemId};if(!t)return;
  openDlg(id?"Task":"Add task",
    fld("","t-title","Task",inp("t-title",t.title,'required placeholder="e.g. Draft Dear Colleague"'))+
    fld("t","t-due","Due",inp("t-due",t.due,'type="date"'))+
    fld("t","t-who","Assigned to",inp("t-who",t.assignee,'list="staff-dl"'))+
    fld("t","t-item","Bill",`<select id="t-item">${itemOpts(t.itemId)}</select>`),
    {col:"tasks",id,save(){const title=gv("t-title");if(!title)return "Describe the task.";
      return {title,due:gv("t-due"),assignee:gv("t-who"),itemId:gv("t-item"),done:!!t.done}}});
}
function officeDlg(){const o=S.office.settings||{};
  openDlg("Office",
    fld("h","o-member","Member",inp("o-member",o.member,'placeholder="Rep. Jane Doe"'))+
    fld("h","o-district","District",inp("o-district",o.district,'placeholder="e.g. OH-04"'))+
    fld("","o-staff","Legislative staff, one per line",`<textarea id="o-staff" style="min-height:120px">${esc((o.staff||[]).join("\n"))}</textarea>`),
    {col:"office",id:"settings",noDel:true,save(){return {member:gv("o-member"),district:gv("o-district"),staff:$("o-staff").value.split("\n").map(s=>s.trim()).filter(Boolean)}}});
}
dlg.addEventListener("submit",e=>{e.preventDefault();if(!ctx)return;
  if(ctx.footer){storageGo();return}if(ctx.copy)return;
  if(ctx.custom){const r=ctx.custom();if(typeof r==="string"){toast(r);return}dlg.close();return}
  const d=ctx.save();if(typeof d==="string"){toast(d);return}
  const id=ctx.id||newId(ctx.col[0]);write(ctx.col,id,d);dlg.close();if(ctx.after)ctx.after(id)});

/* ---------- bill actions ---------- */
function addLog(itemId,text,date){write("updates",newId("u"),{itemId,date:date||today(),text})}
function advance(id,to){const i=S.items[id];if(!i)return;const dates=Object.assign({},i.stageDates||{});dates[to]=today();
  put("items",id,{stage:to,stageDates:dates});addLog(id,to==="closed"?"Closed out":"Moved to "+STAGE_NAME[to]);toast(to==="closed"?"Bill closed out.":"Now in "+STAGE_NAME[to]+".")}
function logContact(id){const c=S.cosponsors[id];if(!c)return;const done=YES(c.status)||c.status==="Declined",f=done?"":addDays(today(),7);
  write("contacts",newId("h"),{coId:id,itemId:c.itemId,date:today(),method:"",by:c.owner||"",note:""});
  put("cosponsors",id,{lastContact:today(),status:c.status==="Target"?"Asked":c.status,followUp:f});
  toast("Contact logged for "+c.office+". Add the method and a note under Details and history.")}

/* ---------- drafts ---------- */
function drafts(kind,id){const i=S.items[id],o=S.office.settings||{},cos=cosOf(id),yes=cos.filter(c=>YES(c.status));
  const name=i.title+(i.number?" ("+i.number+")":""),member=o.member||"[Member name]",lead=i.lead||"[staff name]";
  const dl=okDate(i.cosDeadline)?fmt(i.cosDeadline,{weekday:"long",month:"long",day:"numeric"}):"[deadline]";
  const introduced=SIDX[i.stage||"concept"]>=3;
  const nm=c=>c.office+(pst(c)?" ("+pst(c)+")":"");
  if(kind==="dc")return ["Dear Colleague draft",[
    `Subject: Cosponsor the ${i.title}`,"","Dear Colleague,","",
    `I invite you to join me as ${introduced?"a cosponsor":"an original cosponsor"} of the ${name}.`,"",
    i.summary||"[One or two sentences on what the bill does and why it matters.]","",
    "[Background: the problem, who it affects, and what the bill changes.]","",
    i.endorsements?`This legislation is supported by ${i.endorsements}.`:"[Supporting organizations, if any.]",
    yes.length?`\nCurrent cosponsors (${yes.length}): ${yes.map(nm).join(", ")}.`:"","",
    `To ${introduced?"cosponsor":"sign on as an original cosponsor"} or to ask questions, please contact ${lead} in my office at [email] by ${dl}.`,"","Sincerely,","",member,"Member of Congress"].join("\n")];
  if(kind==="fu")return ["Follow-up email",[
    `Subject: Following up: ${i.title}`,"","Hi [name],","",
    `I'm following up on our request for your boss to cosponsor ${member}'s ${name}.`,"",
    i.summary||"[One-sentence reminder of what the bill does.]","",
    yes.length?`We now have ${yes.length} cosponsor${yes.length===1?"":"s"}${yes.length<=8?": "+yes.map(nm).join(", "):""}.`:"",
    i.endorsements?`It is supported by ${i.endorsements}.`:"","",
    `We plan to ${introduced?"add the next group of cosponsors":"introduce"} after ${dl}. Can I answer any questions or send the bill text?`,"","Thanks,",lead,o.member?"Office of "+o.member:"[Office]"].filter((l,n,a)=>!(l===""&&a[n-1]==="")).join("\n")];
  const grp=(t,l)=>l.length?[`${t} (${l.length})`,...l.map(c=>"  "+nm(c)),""]:[];
  return ["Cosponsor list",[`${name}: cosponsor list as of ${fmt(today(),{month:"long",day:"numeric",year:"numeric"})}`,"",
    ...grp("Co-leads",yes.filter(c=>c.status==="Co-Lead")),
    ...grp("Original cosponsors",yes.filter(c=>c.status!=="Co-Lead"&&c.original)),
    ...grp("Additional cosponsors",yes.filter(c=>c.status!=="Co-Lead"&&!c.original)),
    ...grp("Signed on but not yet filed",yes.filter(c=>!c.filed)),
    ...grp("Leaning yes",cos.filter(c=>c.status==="Leaning yes")),
    ...grp("Asked, awaiting answer",cos.filter(c=>c.status==="Asked")),
    yes.length?"":"No cosponsors yet."].join("\n").trim()];
}
function rundown(){const t=today(),ag=agenda(),L=[],o=S.office.settings||{};
  const line=a=>`- ${fmt(a.date)}${a.time?" "+a.time:""}: [${a.tag}] ${a.title}${a.sub?" / "+a.sub:""}${a.who?" ("+a.who+")":""}`;
  L.push(`LEGISLATIVE RUNDOWN${o.member?", Office of "+o.member:""}`,fmt(t,{weekday:"long",month:"long",day:"numeric",year:"numeric"}),"","BILLS");
  vals(S.items).filter(i=>i.stage!=="closed").sort((a,b)=>SIDX[b.stage||"concept"]-SIDX[a.stage||"concept"]).forEach(i=>{const g=Number(i.cosTarget)||0,c=nCommitted(i.id);
    L.push(`- ${itemTitle(i.id)}: ${STAGE_NAME[i.stage]||"Concept"}${cosOf(i.id).length||g?"; "+c+(g?" of "+g:"")+" cosponsors":""}${i.nextAction?"; next: "+i.nextAction+(okDate(i.nextDue)?" by "+short(i.nextDue):""):""}${i.lead?" ("+i.lead+")":""}`)});
  const late=overdue();if(late.length){L.push("","OVERDUE");late.forEach(a=>L.push(line(a)))}
  const up=ag.filter(a=>a.date>=t&&a.date<=addDays(t,14));L.push("","NEXT 14 DAYS");up.length?up.forEach(a=>L.push(line(a))):L.push("- Nothing dated");
  return L.join("\n")}
function copy(txt,msg){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg),()=>toast("Copying is blocked in this view. Select the text and copy it by hand."))}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT"||el.type==="checkbox")return;
  const a=el.dataset.act,id=el.dataset.id,item=el.dataset.item;
  if(a==="goto")location.hash="bill-"+id;
  else if(a==="new-item")itemDlg();else if(a==="edit-item")itemDlg(id);
  else if(a==="new-co")coDlg(null,item);else if(a==="edit-co")coDlg(id);
  else if(a==="paste-co")pasteDlg(item);
  else if(a==="co-log")logContact(id);
  else if(a==="h-add"){const d=gv("h-date");if(!okDate(d)){toast("Pick the date of the contact.");return}
    const p=addContact(id,d,gv("h-method"),gv("h-by"),gv("h-note"));if(Object.keys(p).length){put("cosponsors",id,p);if(p.lastContact&&$("c-last"))$("c-last").value=p.lastContact;if(p.status&&$("c-status"))$("c-status").value=p.status}
    $("hist").innerHTML=histHtml(id);$("h-note").value=""}
  else if(a==="h-del"){write("contacts",id,null);const h=$("hist");if(h)h.innerHTML=histHtml(el.dataset.co)}
  else if(a==="new-event")eventDlg(null,item);else if(a==="edit-event")eventDlg(id);
  else if(a==="new-task")taskDlg(null,item);else if(a==="edit-task")taskDlg(id);
  else if(a==="office")officeDlg();
  else if(a==="close")dlg.close();
  else if(a==="advance"){const i=S.items[id];if(i)advance(id,PATH[SIDX[i.stage||"concept"]+1][0])}
  else if(a==="close-bill"){if(el.dataset.sure)advance(id,"closed");else{el.dataset.sure="1";el.textContent="Confirm close out"}}
  else if(a==="add-log"){const tx=gv("log-text"),d=gv("log-date");if(!tx){toast("Write what happened first.");return}F.logText="";F.logDate="";addLog(id,tx,okDate(d)?d:today())}
  else if(a==="del-log")write("updates",id,null);
  else if(a==="cf"){F.cf=el.dataset.v;render()}
  else if(a==="sort"){const k=el.dataset.k;F.sort=!F.sort||F.sort.k!==k?{k,dir:1}:F.sort.dir>0?{k,dir:-1}:null;
    try{localStorage.setItem(LS+"-sort",JSON.stringify(F.sort))}catch(x){}render()}
  else if(a==="draft"){const d=drafts(el.dataset.kind,id);openDlg(d[0],`<pre class="draft" id="draft-text">${esc(d[1])}</pre><div class="f muted sm-t">Bracketed text is for you to fill in. The draft pulls from this bill's summary, deadline, supporters and committed cosponsors.</div>`,{copy:true})}
  else if(a==="copy-draft")copy($("draft-text").textContent,"Copied. Paste it into your email or e-Dear Colleague form and edit from there.");
  else if(a==="del"){if(el.dataset.sure){const c=ctx;write(c.col,c.id,null);dlg.close();if(c.cascade)c.cascade()}else{el.dataset.sure="1";el.textContent="Confirm delete"}}
  else if(a==="showdone"){F.done=!F.done;render()}
  else if(a==="clear-ex"){if(el.dataset.sure){const gone=new Set(vals(S.items).filter(d=>d.example).map(d=>d.id));
      DATA.forEach(c=>vals(S[c]).forEach(d=>{if(d.example||((c==="cosponsors"||c==="updates")&&gone.has(d.itemId)))write(c,d.id,null)}))}else{el.dataset.sure="1";el.textContent="Confirm: remove all examples"}}
  else if(a==="storage")storageDlg();
  else if(a==="storage-go")storageGo();
  else if(a==="storage-claude"){if(el.dataset.sure){db.doc("config/backend").set({kind:"claude"}).then(()=>{dlg.close();toast("Back on Claude storage. The Google Sheet is unchanged.")},()=>toast("That did not save. You need Contributor access to change this."))}else{el.dataset.sure="1";el.textContent="Confirm: switch back"}}
  else if(a==="gs-refresh")syncNow();
  else if(a==="assign-ids")assignIds();
  else if(a==="rm-orphans"){if(el.dataset.sure)orphans().forEach(o=>write(o[0],o[1],null));else{el.dataset.sure="1";el.textContent="Confirm: remove them"}}
  else if(a==="copy-rundown")copy(rundown(),"Rundown copied. Paste it into an email or the staff meeting notes.");
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.act==="toggle"){if(S.tasks[el.dataset.id])put("tasks",el.dataset.id,{done:el.checked})}
  else if(el.dataset.act==="co-status"){const v=el.value,p={status:v};if(YES(v)||v==="Declined")p.followUp="";put("cosponsors",el.dataset.id,p)}
  else if(el.id==="f-issue"){F.issue=el.value;render()}
  else if(el.id==="f-lead"){F.lead=el.value;render()}
  else if(el.id==="f-who"){F.who=el.value;render()}
  else if(el.id==="f-closed"){F.closed=el.checked;render()}
  else if(el.id==="log-date"){F.logDate=el.value}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value;render()}else if(e.target.id==="log-text"){F.logText=e.target.value}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&/^h-(note|by|date)$/.test(e.target.id)){e.preventDefault();const b=dlg.querySelector('[data-act="h-add"]');if(b)b.click();return}
  if(e.key==="Enter"&&e.target.id==="log-text"){e.preventDefault();const b=document.querySelector('[data-act="add-log"]');if(b)b.click()}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
boot();
</script>
